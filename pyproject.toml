[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroaxonnet"
version = "0.1.0"
description = "Research-grade retinal ganglion cell axon count-density estimation for optic nerve light microscopy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (Research Prototype)"}
authors = [
    {name = "NeuroAxonNet AI Engineering Team"}
]
keywords = ["neuroscience", "optic-nerve", "axon-density", "deep-learning", "microscopy", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.5.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "matplotlib>=3.7.0",
    "tifffile>=2023.1.1",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
neuroaxonnet = "neuroaxonnet.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
