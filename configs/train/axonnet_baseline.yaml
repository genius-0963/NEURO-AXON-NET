train:
  experiment_name: "axonet_baseline_reproduction"
  optimizer: "adam"
  learning_rate: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  batch_size: 1
  epochs: 25
  grad_clip: 1.0
  seed: 42
  density_scale: 1000.0
  lambda_count: 0.0  # Pure masked MSE for faithful baseline
  save_best_metric: "val_loss"
  split_manifest_path: "data/splits/v1"
  checkpoint_dir: "artifacts/checkpoints"
